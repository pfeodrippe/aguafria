<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Aguafria simple game</title>
    <style>
      :root { color-scheme: dark; font-family: ui-monospace, SFMono-Regular, monospace; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #070a10; }
      main { position: relative; width: min(96vw, 720px); }
      canvas { display: block; width: 100%; aspect-ratio: 4 / 3; background: #040509; border: 1px solid #263043; }
      #error { color: #ff8d8d; white-space: pre-wrap; }
    </style>
  </head>
  <body>
    <main>
      <canvas id="game" width="720" height="540"></canvas>
      <pre id="error"></pre>
    </main>
    <script src="simple-game.js"></script>
    <script src="app.js"></script>
  </body>
</html>
